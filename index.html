    <style>
        /* Türkçe karakterler için Angelina uyumlu eğlenceli el yazısı köprüsü */
        @font-face {
            font-family: 'Angelina';
            src: local('Patrick Hand'), url('https://fonts.gstatic.com/s/patrickhand/v23/LDI1apOQONGhRVrinIS4zROFRPort2U.woff2') format('woff2');
            unicode-range: U+011E-011F, U+0130-0131, U+015E-015F, U+00C7, U+00D6, U+00DC, U+00E7, U+00F6, U+00FC;
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }
        /* Temel karakterler için Angelina (AngelinaRegular / www.fonttr.com) */
        @font-face {
            font-family: 'Angelina';
            src: local('Angelina'), local('AngelinaRegular'), local('angelina'), local('Patrick Hand'), url('https://fonts.gstatic.com/s/patrickhand/v23/LDI1apOQONGhRVrinIS4zROFRPort2U.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #f0f9ff 0%, #e0f2fe 45%, #fefce8 100%);
            min-height: 100vh;
            color: #0f172a;
        }
        .font-display {
            font-family: 'Fredoka', 'Angelina', 'Inter', sans-serif;
        }
        .font-game {
            font-family: 'Angelina', 'Fredoka', 'Inter', sans-serif;
            letter-spacing: 0.01em;
        }
        .btn-game {
            font-family: 'Angelina', 'Fredoka', 'Inter', sans-serif;
            letter-spacing: 0.01em;
            transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.18s ease, border-color 0.18s ease;
        }
        .btn-game:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn-game:active:not(:disabled) {
            transform: translateY(1px);
        }
        /* 1. Ada Modern Laboratuvar Arka Plan Stili */
        .ada1-modern-bg {
            background:
                radial-gradient(circle at 12% 18%, rgba(56, 189, 248, 0.24), transparent 42%),
                radial-gradient(circle at 88% 22%, rgba(99, 102, 241, 0.22), transparent 45%),
                radial-gradient(circle at 50% 92%, rgba(16, 185, 129, 0.18), transparent 48%),
                linear-gradient(135deg, #0f172a 0%, #1e293b 52%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        .ada1-modern-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: floatSlow 2.8s ease-in-out infinite;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: 0;
            z-index: 9999;
            pointer-events: none;
            border-radius: 3px;
            animation: confettiFall linear forwards;
        }

        function pickRandom(arr, count) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy.slice(0, Math.min(count, copy.length));
        }

        function stopQuestionTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }

        function startQuestionTimer() {
            stopQuestionTimer();
            if (!gameState.timedMode) return;
            gameState.questionTimer = 15;
            gameState.timerInterval = setInterval(() => {
                gameState.questionTimer--;
                const el = document.getElementById('active-question-timer');
                if (el) el.textContent = `${gameState.questionTimer} sn`;
                if (gameState.questionTimer <= 0) {
                    stopQuestionTimer();
                    const modId = gameState.activeModuleId || 6;
                    awardPoints(false, modId);
                    updateHeader();
                    advanceInteractiveStep(modId);
                }
            }, 1000);
        }

            }, 1000);

        function finishAda1Session() {
            stopAda1Timer();
            gameState.ada1LastFeedback = null;
            const st = gameState.moduleStats[1] || { correct: 0, wrong: 0, total: 30 };
            const diff = gameState.ada1Difficulty || 'easy';
            const correctCount = st.correct;
            const totalItems = st.total || (diff === 'hard' ? 45 : 30);
            const targetCorrect = diff === 'hard' ? 35 : 25;

            let stars = 1;
            if (correctCount >= targetCorrect) {
                stars = 3;
                st.completed = true;
                triggerConfetti();
            } else if (correctCount >= Math.ceil(targetCorrect * 0.6)) {
                stars = 2;
            }
            updateHeader();

            gameState.ada1Result = {
                diff,
                correctCount,
                totalItems,
                remainingTime: Math.max(0, gameState.ada1TimeLeft),
                remainingLives: Math.max(0, gameState.ada1Lives),
                stars
            };
            render();
        }

        function answerAda3Sort(chosenNatural) {
            if (gameState.ada3Feedback || gameState.ada3Result) return;
            const item = gameState.activeQuestions[gameState.stepIndex];
            if (!item) return;

            const isCorrect = Boolean(chosenNatural) === Boolean(item.isNatural);
            gameState.ada3Feedback = {
                chosenNatural: Boolean(chosenNatural),
                isCorrect
            };
            awardPoints(isCorrect, 3);
            if (!isCorrect) {
                gameState.ada3Lives = Math.max(0, gameState.ada3Lives - 1);
            }
            updateHeader();
            render();

            setTimeout(() => {
                if (gameState.activeModuleId !== 3 || gameState.ada3Result) return;
                gameState.ada3Feedback = null;
                if (gameState.ada3Lives <= 0) {
                    finishAda3Session();
                    return;
                }
                gameState.stepIndex++;
                if (gameState.stepIndex >= gameState.activeQuestions.length) {
                    finishAda3Session();
                    return;
                }
                render();
            }, isCorrect ? 380 : 750);

        function updateHeader() {
            const scoreEl = document.getElementById('header-score');
            const comboEl = document.getElementById('header-combo');
            const badgesEl = document.getElementById('header-badges');
            if (scoreEl) scoreEl.textContent = gameState.totalScore;
            if (comboEl) comboEl.textContent = `${gameState.combo}x`;
            if (badgesEl) {
                const count = Object.values(gameState.moduleStats).filter(m => m.completed).length;
                badgesEl.textContent = `${count}/6`;
            }
        }

        function triggerConfetti() {
            const colors = ['#38bdf8', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6'];
            for (let i = 0; i < 26; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = `${Math.random() * 100}vw`;
                c.style.width = `${6 + Math.random() * 8}px`;
                c.style.height = `${10 + Math.random() * 10}px`;
                c.style.backgroundColor = colors[i % colors.length];
                c.style.animationDuration = `${1.5 + Math.random() * 1.4}s`;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3100);
            }
        }

        function awardPoints(isCorrect, moduleId) {
            const stat = gameState.moduleStats[moduleId];
            if (isCorrect) {
                if (stat) stat.correct++;
                const earned = 100 * gameState.combo;
                gameState.totalScore += earned;
                gameState.combo++;
                if (gameState.combo > gameState.maxCombo) {
                    gameState.maxCombo = gameState.combo;
                }
                return earned;
            } else {
                if (stat) stat.wrong++;
                gameState.combo = 1;
                return 0;
            }
        }

            gameState.ada4Lives = 3;
            gameState.ada4Result = null;
            gameState.ada4SelectedIndices = [];
            gameState.ada4Feedback = null;
            gameState.ada5Lives = 3;
            gameState.ada5Result = null;
            gameState.ada5SelectedIdx = null;
            render();
        }

        function startModule(moduleId) {
            stopQuestionTimer();
            stopAda1Timer();
            stopAda2Timer();
            stopAda3Timer();
            stopAda4Timer();
            stopAda5Timer();
            gameState.currentView = moduleId === 6 ? 'championship' : 'module';
            gameState.activeModuleId = moduleId;
            gameState.stepIndex = 0;
            gameState.ada1LastFeedback = null;
            gameState.ada1Result = null;
            gameState.ada2Result = null;
            gameState.ada2SelectedIdx = null;
            gameState.ada3Difficulty = null;
            gameState.ada3Lives = 3;
            gameState.ada3Result = null;
            gameState.ada3Feedback = null;
            gameState.ada4Difficulty = null;
            gameState.ada4Lives = 3;
            gameState.ada4Result = null;
            gameState.ada4SelectedIndices = [];
            gameState.ada4Feedback = null;
            gameState.ada5Lives = 3;
            gameState.ada5Result = null;
            gameState.ada5SelectedIdx = null;

            if (moduleId === 1) {
                gameState.ada1Difficulty = null;
                gameState.activeQuestions = [];
            } else if (moduleId === 2) {
                // Her görev için kapsül seçeneklerini karıştırarak doğru cevabın farklı sıralarda çıkmasını sağla
                gameState.activeQuestions = pickRandom(POOL_ADA2, 30).map(item => {
                    const correctCapsule = item.capsules[item.correct];
                    const shuffledCapsules = pickRandom(item.capsules, item.capsules.length);
                    const newCorrectIdx = shuffledCapsules.findIndex(c => c.name === correctCapsule.name);
                    return {
                        ...item,
                        capsules: shuffledCapsules,
                        correct: newCorrectIdx >= 0 ? newCorrectIdx : 0
                    };
                });
                gameState.moduleStats[2] = { completed: gameState.moduleStats[2].completed, correct: 0, wrong: 0, total: gameState.activeQuestions.length };
                startAda2Countdown();
            } else if (moduleId === 3) {
                gameState.activeQuestions = [];
            } else if (moduleId === 4) {
                gameState.activeQuestions = [];
            } else if (moduleId === 5) {
                gameState.activeQuestions = pickRandom(POOL_ADA5, 30);
                gameState.moduleStats[5] = { completed: gameState.moduleStats[5].completed, correct: 0, wrong: 0, total: gameState.activeQuestions.length };
                startAda5Countdown();
            } else if (moduleId === 6) {
                gameState.activeQuestions = pickRandom(POOL_CHAMPIONSHIP, 10).map(item => {
                    const correctText = item.options[item.correct];
                    const shuffledOptions = pickRandom(item.options, item.options.length);
                    const newCorrectIdx = shuffledOptions.findIndex(opt => opt === correctText);
                    return {
                        ...item,
                        options: shuffledOptions,
                        correct: newCorrectIdx >= 0 ? newCorrectIdx : 0
                    };
                });
                gameState.moduleStats[6] = { completed: gameState.moduleStats[6].completed, correct: 0, wrong: 0, total: gameState.activeQuestions.length };
            }

            if (gameState.timedMode && moduleId === 6) {
                startQuestionTimer();
            }
            render();
        }

        function startAda1Mode(diff) {
            gameState.ada1Difficulty = diff;
            gameState.stepIndex = 0;
            gameState.ada1Lives = 3;
            gameState.ada1LastFeedback = null;
            gameState.ada1Result = null;
            const pool = diff === 'hard' ? POOL_ADA1_HARD : POOL_ADA1_EASY;
            const count = diff === 'hard' ? 45 : 30;
            gameState.activeQuestions = pickRandom(pool, count);
            gameState.moduleStats[1] = {
                completed: gameState.moduleStats[1].completed,
                correct: 0,
                wrong: 0,
                total: gameState.activeQuestions.length
            };
            startAda1Countdown();
            render();
        }

        function answerAda1(chosenGroup) {
            if (gameState.ada1LastFeedback || gameState.ada1Result) return;
            const item = gameState.activeQuestions[gameState.stepIndex];
            if (!item) return;

            const isCorrect = chosenGroup === item.group;
            gameState.ada1LastFeedback = {
                chosenGroup,
                correctGroup: item.group,
                isCorrect
            };
            awardPoints(isCorrect, 1);
            if (!isCorrect) {
                gameState.ada1Lives = Math.max(0, gameState.ada1Lives - 1);
            }
            updateHeader();
            render();

            setTimeout(() => {
                if (gameState.activeModuleId !== 1 || gameState.ada1Result) return;
                gameState.ada1LastFeedback = null;
                if (gameState.ada1Lives <= 0) {
                    finishAda1Session();
                    return;
                }
                gameState.stepIndex++;
                if (gameState.stepIndex >= gameState.activeQuestions.length) {
                    finishAda1Session();
                    return;
                }
                render();
            }, isCorrect ? 380 : 750);
        }

        function advanceInteractiveStep(modId) {
            gameState.stepIndex++;
            gameState.ada2SelectedIdx = null;
            gameState.ada3Feedback = null;
            gameState.ada4SelectedIndices = [];
            gameState.ada4Feedback = null;
            gameState.ada5SelectedIdx = null;

            if (gameState.stepIndex >= gameState.activeQuestions.length) {
                if (modId === 2) {
                    finishAda2Session();
                    return;
                }
                stopQuestionTimer();
                const stat = gameState.moduleStats[modId];
                if (stat && stat.correct >= Math.ceil(stat.total * 0.6)) {
                    stat.completed = true;
                    triggerConfetti();
                }
                updateHeader();
                goHome();
                return;
            }
            render();
        }

        function startAda3Mode(diff) {
            gameState.ada3Difficulty = diff;
            gameState.stepIndex = 0;
            gameState.ada3Lives = 3;
            gameState.ada3Feedback = null;
            gameState.ada3Result = null;
            const pool = diff === 'hard' ? POOL_ADA3_HARD : POOL_ADA3;
            const count = diff === 'hard' ? 45 : 30;
            gameState.activeQuestions = pickRandom(pool, count);
            gameState.moduleStats[3] = {

                total: gameState.activeQuestions.length

        function startAda4Mode(diff) {
            gameState.ada4Difficulty = diff;
            gameState.stepIndex = 0;
            gameState.ada4Lives = 3;
            gameState.ada4SelectedIndices = [];
            gameState.ada4Feedback = null;
            gameState.ada4Result = null;
            const count = diff === 'hard' ? 20 : 10;
            gameState.activeQuestions = pickRandom(POOL_ADA4, count).map(meal => ({
                ...meal,
                items: pickRandom(meal.items.slice(0, 6), 6)
            }));
            gameState.moduleStats[4] = {
                completed: gameState.moduleStats[4].completed,
                correct: 0,
                wrong: 0,
                total: gameState.activeQuestions.length
            };
            startAda4Countdown();
            render();
        }

        function toggleAda4Item(idx) {
            if (gameState.ada4Feedback || gameState.ada4Result) return;
            const pos = gameState.ada4SelectedIndices.indexOf(idx);
            if (pos >= 0) {
                gameState.ada4SelectedIndices.splice(pos, 1);
            } else if (gameState.ada4SelectedIndices.length < 3) {
                gameState.ada4SelectedIndices.push(idx);
            }
            render();
        }

        function submitAda4Plate() {
            if (gameState.ada4Feedback || gameState.ada4Result || gameState.ada4SelectedIndices.length !== 3) return;
            const q = gameState.activeQuestions[gameState.stepIndex];
            if (!q) return;
            const isCorrect = gameState.ada4SelectedIndices.every(i => q.items[i] && q.items[i].healthy);
            gameState.ada4Feedback = { isCorrect };
            awardPoints(isCorrect, 4);
            if (!isCorrect) {
                gameState.ada4Lives = Math.max(0, gameState.ada4Lives - 1);
            }
            updateHeader();
            render();

            setTimeout(() => {
                if (gameState.activeModuleId !== 4 || gameState.ada4Result) return;
                gameState.ada4Feedback = null;
                gameState.ada4SelectedIndices = [];
                if (gameState.ada4Lives <= 0) {
                    finishAda4Session();
                    return;
                }
                gameState.stepIndex++;
                if (gameState.stepIndex >= gameState.activeQuestions.length) {
                    finishAda4Session();
                    return;
                }
                render();
            }, isCorrect ? 550 : 850);
        }

        function answerAda5Shield(chosenBool) {
            if (gameState.ada5SelectedIdx !== null || gameState.ada5Result) return;
            const q = gameState.activeQuestions[gameState.stepIndex];
            if (!q) return;
            const isCorrect = Boolean(chosenBool) === Boolean(q.correct);
            gameState.ada5SelectedIdx = chosenBool;
            awardPoints(isCorrect, 5);
            if (!isCorrect) {
                gameState.ada5Lives = Math.max(0, gameState.ada5Lives - 1);
            }
            updateHeader();
            render();

            setTimeout(() => {
                if (gameState.activeModuleId !== 5 || gameState.ada5Result) return;
                gameState.ada5SelectedIdx = null;
                if (gameState.ada5Lives <= 0) {
                    finishAda5Session();
                    return;
                }
                gameState.stepIndex++;
                if (gameState.stepIndex >= gameState.activeQuestions.length) {
                    finishAda5Session();
                    return;
                }
                render();
            }, isCorrect ? 420 : 750);
        }

        function answerChampionship(idx) {
            if (gameState.ada5SelectedIdx !== null) return;
            const q = gameState.activeQuestions[gameState.stepIndex];
            if (!q) return;
            stopQuestionTimer();
            const isCorrect = idx === q.correct;
            gameState.ada5SelectedIdx = idx;
            awardPoints(isCorrect, 6);
            updateHeader();
            render();

            setTimeout(() => {
                if (gameState.activeModuleId !== 6) return;
                advanceInteractiveStep(6);
            }, 700);
        }

        function updateChampionship(idx) {
            if (gameState.ada5SelectedIdx !== null) return;
            const q = gameState.activeQuestions[gameState.stepIndex];
            if (!q) return;
            stopQuestionTimer();
            const isCorrect = idx === q.correct;

            setTimeout(() => {

                    </div>
                    <div class="bg-sky-50 border border-sky-200 rounded-2xl p-3">
                        <div class="font-display text-xl font-bold text-sky-900">${gameState.maxCombo}x</div>
                        <div class="text-[11px] font-bold text-sky-700">En Yüksek Seri</div>
                    </div>
                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3">
                        <div class="font-display text-xl font-bold text-emerald-900">${Object.values(gameState.moduleStats).filter(m => m.completed).length}/6</div>
                        <div class="text-[11px] font-bold text-emerald-700">Ada Rozeti</div>
                    </div>
                </div>
                <div class="space-y-2 mb-5">${rows}</div>
                <div class="flex justify-end gap-2">
                    <button onclick="resetEntireGame()" class="btn-game bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs px-4 py-2.5 rounded-xl">
                        İlerlemeyi Sıfırla
                    </button>
                    <button onclick="closeReportCard()" class="btn-game bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-5 py-2.5 rounded-xl">
                        Kapat
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeReportCard() {
            const modal = document.getElementById('report-modal');
            if (modal) modal.classList.add('hidden');
        }

        function resetEntireGame() {
            stopQuestionTimer();
            stopAda1Timer();
            stopAda2Timer();
            stopAda3Timer();
            stopAda4Timer();
            stopAda5Timer();
            gameState.currentView = 'home';
            gameState.activeModuleId = null;
            gameState.stepIndex = 0;
            gameState.activeQuestions = [];
            gameState.totalScore = 0;
            gameState.combo = 1;
            gameState.maxCombo = 1;
            gameState.ada1Difficulty = null;
            gameState.ada1Lives = 3;
            gameState.ada1TimeLeft = 60;
            gameState.ada1LastFeedback = null;
            gameState.ada1Result = null;
            gameState.ada2TimeLeft = 60;
            gameState.ada2Result = null;
            gameState.ada3Difficulty = null;
            gameState.ada3Lives = 3;
            gameState.ada3TimeLeft = 60;
            gameState.ada3Feedback = null;
            gameState.ada3Result = null;
            gameState.ada4Difficulty = null;
            gameState.ada4Lives = 3;
            gameState.ada4TimeLeft = 60;
            gameState.ada4Result = null;
            gameState.ada4SelectedIndices = [];
            gameState.ada4Feedback = null;
            gameState.ada5Lives = 3;
            gameState.ada5TimeLeft = 60;
            gameState.ada5Result = null;
            gameState.ada5SelectedIdx = null;
            gameState.moduleStats = {
                1: { completed: false, correct: 0, wrong: 0, total: 30 },
                2: { completed: false, correct: 0, wrong: 0, total: 30 },
                3: { completed: false, correct: 0, wrong: 0, total: 30 },
                4: { completed: false, correct: 0, wrong: 0, total: 10 },
                5: { completed: false, correct: 0, wrong: 0, total: 30 },
                6: { completed: false, correct: 0, wrong: 0, total: 10 }
            };
            closeReportCard();
            render();
        }

        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
